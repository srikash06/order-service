server:
  port: 8080

spring:

  application:
    name: order-service

  datasource:

    url: ${DB_URL}

    username: ${DB_USERNAME}

    password: ${DB_PASSWORD}

    driver-class-name: org.postgresql.Driver

  jpa:

    hibernate:
      ddl-auto: update

    show-sql: false

    properties:
      hibernate:
        format_sql: true

management:

  endpoints:

    web:

      exposure:
        include:
          - health
          - info
          - prometheus

  endpoint:

    health:

      probes:
        enabled: true

      show-details: never